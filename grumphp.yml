grumphp:
  ascii:
    succeeded: ~
    failed: ~
  tasks:
    composer: null
    phplint: null
    yamllint:
      parse_custom_tags: true
    phpcs:
      standard: './phpcs.xml'
      triggered_by:
        - php
        - module
        - inc
        - install
        - test
        - profile
        - theme
    git_branch_name:
      whitelist:
        - 'master'
        - 'main'
        - '/^feature\/.*/'
        - '/^bugfix\/.*/'
        - '/^hotfix\/.*/'
        - '/^release\/.*/'
        - '/^IXM23-\d+/'
        - 'stage'
        - 'staging'
        - 'production'
