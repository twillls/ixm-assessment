services:
  # What to call the service hosting the site.
  php:
    # This should match your hosting/local setups.
    image: tugboatqa/php:8.3-apache

    # Set this as the default service. This does a few things
    #   1. Clones the git repository into the service container
    #   2. Exposes port 80 to the Tugboat HTTP proxy
    #   3. Routes requests to the preview URL to this service
    default: true
    # Wait until the mysql service is done building
    depends:
      - mysql
#      - solr

    # A set of commands to run while building this service
    commands:
      # Commands that set up the basic preview infrastructure
      init:
        - echo "===== init"
        # Install opcache and mod-rewrite.
        - docker-php-ext-install opcache
        - apt-get update && apt-get -yq install libzip-dev nano ca-certificates curl gnupg
        - docker-php-ext-install bcmath
        - docker-php-ext-install zip
        - a2enmod headers rewrite
        # @todo this should match Docksal.
        - composer self-update ${COMPOSER_VERSION:-2.3.10}

        # NodeJS / NPM.
        - mkdir -p /etc/apt/keyrings
        - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o
          /etc/apt/keyrings/nodesource.gpg
        - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_${NODE_VERSION:-16}.x nodistro main" |
          tee /etc/apt/sources.list.d/nodesource.list
        - apt-get update
        - apt-get install -yq nodejs

        # Install Yarn. Core pack will set version.
        - npm install --global yarn
        - corepack enable

        # Install drush-launcher, if desired.
        - wget -O /usr/local/bin/drush https://github.com/drush-ops/drush-launcher/releases/download/0.6.0/drush.phar
        - chmod +x /usr/local/bin/drush

        # Link the document root to the expected path. This example links /web
        # to the docroot.
        - ln -snf "${TUGBOAT_ROOT}/docroot" "${DOCROOT}"

        # increase php memory limit to 256M
        - echo "memory_limit = 256M" >> /usr/local/etc/php/conf.d/my-php.ini

        # enable display errors.
        - echo "display_errors = On" >> /usr/local/etc/php/conf.d/my-php.ini

        # Enable colored terminal and some aliases
        - sed -e '9,13 s/#//' -i ~/.bashrc
        - sed -e '16,19 s/#//' -i ~/.bashrc

      # Commands that import files, databases,  or other assets. When an
      # existing preview is refreshed, the build workflow starts here,
      # skipping the init step, because the results of that step will
      # already be present.
      update:
        - echo "===== update"

        # PHP mem issues this should be updated per project.
        - echo "memory_limit = 512M" >> /usr/local/etc/php/conf.d/my-php.ini

        # Install/update packages managed by composer, including drush.
        # Note: Make sure the docroot is properly set "/docroot" or "/web".
        - rm -rf vendor/ docroot/modules/contrib/ docroot/core/
        - composer self-update ${COMPOSER_VERSION:-2.3.10}
        - composer install --optimize-autoloader

        # Set file permissions such that Drupal will not complain
        - mkdir -p "${DOCROOT}/sites/default/files"
        - chgrp -R www-data "${DOCROOT}/sites/default/files"
        - find "${DOCROOT}/sites/default/files" -type d -exec chmod 2775 {} \;
        - find "${DOCROOT}/sites/default/files" -type f -exec chmod 0664 {} \;
        - mkdir -p "${DOCROOT}/sites/default/files-private"
        - chgrp -R www-data "${DOCROOT}/sites/default/files-private"
        - find "${DOCROOT}/sites/default/files-private" -type d -exec chmod 2775 {} \;
        - find "${DOCROOT}/sites/default/files-private" -type f -exec chmod 0664 {} \;

        # Setup from Prod/Ci Alias.
        # Edit for your env
        #- ${TUGBOAT_ROOT}/vendor/bin/drush sql-sync @alias.dev @self --create-db -y
        - rm -rf /tmp/*

      # only step that executes on new PR or tugboat builds from base previews
      build:
        - echo "===== build"

        # PHP mem issues.
        - echo "memory_limit = 512M" >> /usr/local/etc/php/conf.d/my-php.ini

        # Ensure fresh libs.
        # Note: Make sure the docroot is properly set "/docroot" or "/web".
        - rm -rf vendor/ docroot/modules/contrib/ docroot/core/

        # @todo change to match docksal.
        - composer self-update ${COMPOSER_VERSION:-2.3.10}
        - composer install

        # Updb/Config/Cache and Frontend.
        - ${TUGBOAT_ROOT}/vendor/bin/swat deploy
        - ${TUGBOAT_ROOT}/vendor/bin/swat frontend

        # HARD FAIL IF NO SHIELD - DO NOT REMOVE.
        - ${TUGBOAT_ROOT}/vendor/bin/drush pm-enable shield -y
        - ${TUGBOAT_ROOT}/vendor/bin/drush cset shield.settings shield_enable 1 -y

        # Post back to Jira ticket.
        - ${TUGBOAT_ROOT}/.tugboat/update-jira.sh

      # runs once all services are running, runs on rebuild
      #online: { }

      # This is run on clone, but not build
      #clone: { }

    # Urls set here run visual diffs and lighthouse (eventually cypress).
    urls:
      - /

  mysql:
    image: tugboatqa/mariadb:10.6.5-focal
    commands:
      init:
        # Increase the allowed packet size to 512MB.
        - mysql -e "SET GLOBAL max_allowed_packet=2147483648;"
        # Ensure this packet size persists even if MySQL restarts.
        - echo "max_allowed_packet=2147483648" >> /etc/mysql/tugboat.cnf

